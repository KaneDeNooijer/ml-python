# Local development only: `docker compose up` starts the ML service on http://localhost:8101.
services:
  app:
    build:
      context: .
      target: dev
    init: true
    ports:
      - "${APP_PORT:-8101}:8100"
    volumes:
      - .:/app
    command: >-
      sh -c "uv sync --locked --group dev
      && exec uvicorn poc_ml.api:app --host 0.0.0.0 --port 8100 --reload"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8100/health", timeout=2)'
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
