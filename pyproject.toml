[project]
name = "poc-ml"
version = "0.1.0"
description = "LLMaaltijd proof of concept: estimating missing NOVA groups with machine learning, used by Laravel."
readme = "README.md"
authors = [
    { name = "Kane de Nooijer", email = "kanedenooijer@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.7.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
poc-ml = "poc_ml:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py313"
